[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual_arm_v2_2_sdk"
version = "1.0.0"
description = "Python binding for the Dual Arm V2.2 ControlApi"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["dual_arm_v2_2_sdk", "dual_arm_v2_2_sdk.libs"]

[tool.setuptools.package-data]
dual_arm_v2_2_sdk = ["*.so"]
"dual_arm_v2_2_sdk.libs" = ["*.so", "*.so.*"]
